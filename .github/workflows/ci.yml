name: Source and database checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_DB: heavyhaul_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable_ci_password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d heavyhaul_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGDATABASE: heavyhaul_test
      PGUSER: postgres
      PGPASSWORD: disposable_ci_password
      B13_SKIP_DOTENV: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run db:init
      - run: npm run db:smoke
      - run: npm run db:check
      - run: node tests/migration_checksum_test.js
