services:
  database:
    image: postgis/postgis:18-3.6
    environment:
      POSTGRES_DB: ${PGDATABASE:-heavyhaul}
      POSTGRES_USER: ${PGUSER:-heavyhaul_admin}
      POSTGRES_PASSWORD: ${PGPASSWORD:?Set PGPASSWORD in .env first}
    ports:
      - "127.0.0.1:${PGPORT:-5432}:5432"
    volumes:
      - database-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  database-data:
